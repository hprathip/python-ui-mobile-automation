name: tests

on:
 push:
  branches: [main]
 pull_request:
 workflow_dispatch:

jobs:
 api:
  runs-on: ubuntu-latest
  timeout-minutes: 10
  steps:
   - uses: actions/checkout@v4

   - uses: actions/setup-python@v5
     with:
      python-version: "3.13"
      cache: pip
   - name: Install dependencies
     run: python -m pip install -r requirements.txt
   
   - name: Run API tests
     run: python -m pytest tests/api -v